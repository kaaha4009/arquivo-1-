<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Meu Site</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f2f2f2;
      margin: 0;
      padding: 0;
    }

    .container {
      margin-top: 100px;
      background: white;
      padding: 40px;
      max-width: 500px;
      margin-left: auto;
      margin-right: auto;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    h1 {
      color: #333;
    }

    p {
      color: #666;
    }

    .botao {
      display: inline-block;
      margin-top: 20px;
      padding: 10px 20px;
      background: black;
      color: white;
      text-decoration: none;
      border-radius: 5px;
    }

    .botao:hover {
      background: #444;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Bem-vindo ao meu site 🚀</h1>
    <p>Este é o início do meu projeto online.</p>
    <a class="botao" href="#">Saiba mais</a>
  </div>

</body>
</html>
