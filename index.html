<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Curso de Cartas - Chão dos Caveira</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
margin: 0;
font-family: 'Georgia', serif;
background: radial-gradient(circle at top, #1a001f, #000);
overflow-x: hidden;
color: #fff;
}

/* FUNDO NÉVOA */
.fog {
position: fixed;
width: 200%;
height: 200%;
background: url('https://i.imgur.com/3ZQ3Z9M.png');
opacity: 0.08;
animation: fogMove 60s linear infinite;
}

@keyframes fogMove {
0% { transform: translate(0,0); }
100% { transform: translate(-20%, -20%); }
}

/* PARTÍCULAS */
.particle {
position: absolute;
width: 4px;
height: 4px;
background: #a855f7;
border-radius: 50%;
opacity: 0.6;
animation: floatUp 10s linear infinite;
}

@keyframes floatUp {
0% { transform: translateY(100vh); opacity: 0; }
50% { opacity: 1; }
100% { transform: translateY(-10vh); opacity: 0; }
}

/* CARTAS FLUTUANDO */
.card {
position: absolute;
width: 60px;
height: 90px;
background: url('https://i.imgur.com/8QfQ9Qm.png');
background-size: cover;
opacity: 0.7;
animation: floatCard 12s infinite ease-in-out;
}

@keyframes floatCard {
0% { transform: translateY(100vh) rotate(0deg); }
50% { transform: translateY(50vh) rotate(180deg); }
100% { transform: translateY(-20vh) rotate(360deg); }
}

/* CONTEÚDO */
.container {
position: relative;
text-align: center;
padding: 120px 20px;
z-index: 2;
}

h1 {
font-size: 42px;
text-shadow: 0 0 15px #a855f7;
}

p {
font-size: 18px;
opacity: 0.85;
max-width: 600px;
margin: auto;
}

/* BOTÃO ELITE */
.btn {
margin-top: 40px;
padding: 18px 40px;
font-size: 18px;
border: none;
cursor: pointer;
border-radius: 12px;
color: white;
background: linear-gradient(45deg, #7e22ce, #a855f7);
box-shadow: 0 0 20px #a855f7;
transition: 0.3s;
}

.btn:hover {
transform: scale(1.1);
box-shadow: 0 0 40px #c084fc;
}

/* VELAS */
.candle {
position: absolute;
bottom: 0;
width: 20px;
height: 60px;
background: #222;
border-radius: 10px;
}

.flame {
width: 15px;
height: 15px;
background: orange;
border-radius: 50%;
position: absolute;
top: -10px;
left: 50%;
transform: translateX(-50%);
animation: flicker 0.2s infinite;
box-shadow: 0 0 20px orange;
}

@keyframes flicker {
0% { transform: translateX(-50%) scale(1); opacity: 1; }
50% { transform: translateX(-50%) scale(1.2); opacity: 0.7; }
100% { transform: translateX(-50%) scale(0.9); opacity: 1; }
}
</style>
</head>

<body>

<div class="fog"></div>

<div class="container">
<h1>Curso de Cartas & Intuição</h1>
<p>Desperte sua mediunidade, interpretação espiritual e leitura intuitiva com profundidade energética.</p>

<button class="btn">Quero acessar por R$97</button>
</div>

<!-- VELAS -->
<div class="candle" style="left:20%;">
<div class="flame"></div>
</div>

<div class="candle" style="left:80%;">
<div class="flame"></div>
</div>

<script>
// PARTÍCULAS
for(let i=0;i<40;i++){
let p = document.createElement("div");
p.className = "particle";
p.style.left = Math.random()*100 + "vw";
p.style.animationDuration = (5 + Math.random()*10) + "s";
document.body.appendChild(p);
}

// CARTAS
for(let i=0;i<8;i++){
let c = document.createElement("div");
c.className = "card";
c.style.left = Math.random()*100 + "vw";
c.style.animationDuration = (8 + Math.random()*10) + "s";
document.body.appendChild(c);
}
</script>

</body>
</html>
