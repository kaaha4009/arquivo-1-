<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Curso de Cartas - Despertar Espiritual</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0a0010;
    color: #fff;
    overflow-x: hidden;
}

/* 🌫️ NÉVOA */
.fog {
    position: fixed;
    width: 200%;
    height: 200%;
    background: url('https://i.imgur.com/9Q9XQ9m.png');
    opacity: 0.08;
    animation: fogMove 60s linear infinite;
    z-index: -3;
}

@keyframes fogMove {
    from { transform: translateX(0); }
    to { transform: translateX(-50%); }
}

/* ✨ ESTRELAS */
.stars {
    position: fixed;
    width: 100%;
    height: 100%;
    background: radial-gradient(white 1px, transparent 1px);
    background-size: 3px 3px;
    opacity: 0.15;
    animation: twinkle 3s infinite alternate;
    z-index: -2;
}

@keyframes twinkle {
    from { opacity: 0.1; }
    to { opacity: 0.25; }
}

/* 🃏 CARTAS FLUTUANDO */
.card-float {
    position: fixed;
    width: 80px;
    height: 120px;
    background: url('https://i.imgur.com/8QZQZQm.png') center/cover;
    opacity: 0.6;
    animation: floatUp 12s linear infinite;
    z-index: -1;
}

@keyframes floatUp {
    0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
    20% { opacity: 0.7; }
    100% { transform: translateY(-20vh) rotate(360deg); opacity: 0; }
}

/* 🕯️ VELAS */
.candle {
    position: fixed;
    bottom: 0;
    width: 40px;
    height: 100px;
    background: linear-gradient(#222, #111);
    border-radius: 10px;
    z-index: 1;
}

.flame {
    position: absolute;
    top: -20px;
    left: 50%;
    width: 15px;
    height: 25px;
    background: orange;
    border-radius: 50%;
    transform: translateX(-50%);
    animation: flicker 0.2s infinite;
    box-shadow: 0 0 20px orange;
}

@keyframes flicker {
    0% { transform: translateX(-50%) scale(1); opacity: 1; }
    50% { transform: translateX(-50%) scale(1.2); opacity: 0.7; }
    100% { transform: translateX(-50%) scale(0.9); opacity: 1; }
}

/* CONTEÚDO */
header {
    text-align: center;
    padding: 80px 20px;
}

h1 {
    font-size: 3em;
    color: #d6a4ff;
    text-shadow: 0 0 20px #a855f7;
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 20px;
}

.card {
    background: rgba(255,255,255,0.05);
    padding: 20px;
    margin: 20px 0;
    border-radius: 15px;
    border: 1px solid rgba(168,85,247,0.4);
    backdrop-filter: blur(10px);
}

button {
    background: linear-gradient(45deg, #7e22ce, #a855f7);
    color: white;
    padding: 15px 25px;
    border: none;
    border-radius: 30px;
    font-size: 18px;
    cursor: pointer;
}
</style>
</head>

<body>

<!-- EFEITOS -->
<div class="fog"></div>
<div class="stars"></div>

<!-- CARTAS FLUTUANDO -->
<div class="card-float" style="left:10%; animation-delay:0s;"></div>
<div class="card-float" style="left:30%; animation-delay:3s;"></div>
<div class="card-float" style="left:60%; animation-delay:6s;"></div>
<div class="card-float" style="left:80%; animation-delay:2s;"></div>

<!-- VELAS -->
<div class="candle" style="left:20%;">
    <div class="flame"></div>
</div>

<div class="candle" style="left:70%;">
    <div class="flame"></div>
</div>

<header>
    <h1>Desperte sua Intuição Espiritual</h1>
    <p>Curso de Baralho Cigano e Leitura Intuitiva</p>
</header>

<div class="container">

    <div class="card">
        <h2>🔮 Energia e Intuição</h2>
        <p>Aprenda a sentir e interpretar as cartas com profundidade espiritual.</p>
    </div>

    <div class="card">
        <h2>✨ Acesso imediato</h2>
        <p>Comece sua jornada assim que se inscrever.</p>
    </div>

    <div class="card">
        <h2>💰 Oferta especial</h2>
        <p><strong>R$97 acesso completo</strong></p>
    </div>

    <div class="card" style="text-align:center;">
        <button onclick="comprar()">Quero meu acesso</button>
    </div>

</div>

<script>
function comprar() {
    alert("Redirecionando...");
}
</script>

</body>
</html>
